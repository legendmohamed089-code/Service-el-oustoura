<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات الأسطورة - LEGEND SERVICES</title>
    <!-- استيراد خط Tajawal العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #d4af37;
            --accent-hover: #b38f27;
            --text-main: #334155;
            --text-light: #64748b;
            --bg-light: #f1f5f9;
            --white: #ffffff;
            --success: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* رأس الصفحة */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            height: 55px;
            width: auto;
            border-radius: 8px;
            background: #fff;
            padding: 2px;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent);
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: #cbd5e1;
            letter-spacing: 1px;
        }

        .header-cta {
            background-color: var(--success);
            color: var(--white);
            padding: 0.6rem 1.3rem;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .header-cta:hover {
            background-color: #1eb954;
            transform: translateY(-2px);
        }

        /* واجهة الهيرو (Hero Section) */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.92)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') center/cover;
            color: var(--white);
            text-align: center;
            padding: 5rem 1rem;
        }

        .hero-logo-big {
            max-width: 160px;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
            background: #fff;
            padding: 5px;
        }

        .hero h1 {
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 1.2rem;
            color: var(--white);
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.15rem;
            max-width: 700px;
            margin: 0 auto 2rem auto;
            color: #cbd5e1;
        }

        .btn-main {
            background-color: var(--accent);
            color: var(--primary);
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            transition: 0.3s;
        }

        .btn-main:hover {
            background-color: var(--accent-hover);
            transform: scale(1.03);
        }

        /* حاوية المحتوى الرئيسي */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .section-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title h2 {
            font-size: 2.1rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .section-title p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        /* شبكة البطاقات */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .service-card {
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            color: var(--white);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-visa {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        }

        .card-docs {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-top: 4px solid var(--accent);
        }

        .card-realestate {
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .plane-icon-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.18);
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .plane-icon-wrapper i.fa-plane-departure {
            font-size: 2.2rem;
            color: var(--accent);
        }

        .plane-icon-wrapper i.fa-earth-americas {
            font-size: 1.8rem;
            color: #38bdf8;
        }

        .visa-subtext {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fef08a;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }
